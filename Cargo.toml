[package]
name = "fesreview"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"
