  <path d="M82 100 238 240 82 380Z" fill="#f4fbfd"/>
  <rect x="286" y="96" width="62" height="288" rx="24" fill="#36d8f5"/>
  <rect x="374" y="96" width="62" height="288" rx="24" fill="#36d8f5"/>
  <text x="240" y="445" fill="#f4fbfd" font-family="system-ui, sans-serif" font-size="42" font-weight="700" letter-spacing="2" text-anchor="middle">PLAY / PAUSE</text>
</svg>
